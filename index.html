<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
  </script>

  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    model-viewer {
      width: 100%;
      height: 100vh;
      background: transparent;
    }
  </style>
</head>

<body>

  <model-viewer
  src="./garraproyecto.glb"
  autoplay
  loop
  camera-controls
  interaction-prompt="none"
  shadow-intensity="0"
  camera-orbit="0deg 75deg 230%"
  camera-target="0.7m 1.5m -0.2m"
  min-camera-orbit="auto auto 100%"
  max-camera-orbit="auto auto 200%"
  field-of-view="45deg">
</model-viewer>

</body>
</html>
