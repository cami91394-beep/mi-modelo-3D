<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
  </script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
    }

    model-viewer {
      width: 100%;
      height: 100%;
      background: transparent;
    }
  </style>
</head>

<body>

  <model-viewer
    src="./garraproyecto.glb"
    autoplay
    loop
    camera-controls
    interaction-prompt="none"
    shadow-intensity="0">
  </model-viewer>

</body>
</html>
